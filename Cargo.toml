[package]
name = "vrc-picture-histogram-checker"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Analyzes pictures saved by VRChat and shows their histogram as a SteamVR overlay"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libloading = "0.9.0"
notify = "8.2.0"
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation"] }

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
panic = "abort"
